<svg xmlns="http://www.w3.org/2000/svg" width="560" height="344" viewBox="0 0 560 344" role="img" aria-labelledby="title desc">
  <title id="title">EIFICA method overview</title>
  <desc id="desc">FICA approximation and screening support temporal AGC ramp and cumulative SOC modeling. Temporal envelopes initialize constraint sets, and Exact EIFICA adds violated constraints until the prescribed tolerance is met.</desc>
  <rect width="560" height="344" rx="14" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="24" y="35" font-size="18" font-weight="700" fill="#182b49">METHOD AT A GLANCE</text>
    <g stroke-width="1.5">
      <rect x="24" y="52" width="512" height="60" rx="8" fill="#edf3fb" stroke="#c8d9ee"/>
      <rect x="24" y="126" width="512" height="60" rx="8" fill="#fff4e7" stroke="#edcfaa"/>
      <rect x="24" y="200" width="512" height="60" rx="8" fill="#edf7f2" stroke="#bfdfca"/>
      <rect x="24" y="274" width="512" height="54" rx="8" fill="#f0eef9" stroke="#d3cbeb"/>
    </g>
    <g font-size="17" font-weight="700" fill="#172b4d">
      <text x="42" y="77">FICA framework</text>
      <text x="42" y="151">Temporal modeling</text>
      <text x="42" y="225">Envelope initialization</text>
      <text x="42" y="300">Exact EIFICA recovery</text>
    </g>
    <g font-size="15" fill="#334155">
      <text x="42" y="99">Convex approximation, scalar screening, network samples</text>
      <text x="42" y="173">AGC adjusted ramps and affine cumulative deployed SOC</text>
      <text x="42" y="247">Reduced initial ramp and SOC constraint sets</text>
      <text x="42" y="320">Add violated temporal constraints to the prescribed tolerance</text>
    </g>
    <g stroke="#94a3b8" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M280 112v14"/>
      <path d="M280 186v14"/>
      <path d="M280 260v14"/>
    </g>
  </g>
</svg>
